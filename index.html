<style>

.ur{font-family:'Noto Nastaliq Urdu',serif;color:var(--ink);font-size:1.4rem;line-height:2}

.hero{min-height:0;background:var(--card);align-items:center}

.hero div.t{color:var(--ink)}

.strips{--g:10px;--H:clamp(220px,50cqw,520px);max-width:1000px;margin:auto;container-type:inline-size;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--g)}

.col{display:flex;flex-direction:column}

.strip{position:relative;height:calc(var(--H) * (100 - var(--cut)) / 100);overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.strip i{position:absolute;top:0;height:var(--H);width:100cqw;left:calc(var(--i) * -1 * (20cqw + var(--g) / 5));background-image:var(--photo,linear-gradient(#0000,#0000)),repeating-linear-gradient(0deg,rgba(60,25,18,.25) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(60,25,18,.2) 0 2px,transparent 2px 46px),linear-gradient(180deg,#d6b48a,#a56f4f 55%,#6b3a2c);background-size:cover,auto,auto,cover;background-position:center}

.poster.small{padding:.8rem 1rem .6rem}
.poster.small .strips{--H:clamp(90px,17cqw,170px)}

.adm label{display:block;margin:.6rem 0;font-weight:600}
.adm input,.adm textarea{display:block;width:100%;padding:.55rem .7rem;font:inherit;border:2px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink)}
.adm .row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.btn.sm{font-size:.9rem;padding:.3rem .8rem;margin:0 0 0 .4rem}
.btn.danger{background:#a33;color:#fff}
</style>

 function done(t){ST=t;loadData().then(route)}
 box.querySelector('#lo').onclick=function(){sb.auth.signOut().then(function(){route()})};
 box.querySelector('#cn').onclick=function(){route()};
 box.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){editing=ROWS.filter(function(e){return e.id==b.dataset.ed})[0];['title','time','location','speaker','topic','details'].forEach(function(n){F(n).value=editing[n==='time'?'event_time':n]||''});F('date').value=editing.event_date;box.querySelector('#eh').textContent='Editing: '+editing.title;window.scrollTo(0,0)}});
 box.querySelectorAll('[data-de]').forEach(function(b){b.onclick=function(){if(confirm('Delete this event?'))sb.from('events').delete().eq('id',b.dataset.de).then(function(r){r.error?alert(r.error.message):done('Event deleted.')})}});
 box.querySelectorAll('[data-da]').forEach(function(b){b.onclick=function(){if(confirm('Delete this announcement?'))sb.from('announcements').delete().eq('id',b.dataset.da).then(function(r){r.error?alert(r.error.message):done('Announcement deleted.')})}});
 ef.onsubmit=function(ev){ev.preventDefault();var sv=box.querySelector('#sv');sv.disabled=true;sv.textContent='Saving...';
  var cf=F('cover').files[0],gf=Array.prototype.slice.call(F('gallery').files);
  var row={title:F('title').value,event_date:F('date').value,event_time:F('time').value,location:F('location').value,speaker:F('speaker').value,topic:F('topic').value,details:F('details').value};
  Promise.all([cf?up(cf):null,Promise.all(gf.map(function(f){return up(f)}))]).then(function(r){
   if(r[0])row.cover_url=r[0];
   var g=((editing&&editing.gallery)||[]).concat(r[1]);if(g.length)row.gallery=g;
   return editing?sb.from('events').update(row).eq('id',editing.id):sb.from('events').insert(row)}).then(function(r){if(r.error)throw r.error;done('Event saved.')}).catch(function(e){sv.disabled=false;sv.textContent='Save event';alert('Could not save: '+(e.message||e))})};
 af.onsubmit=function(ev){ev.preventDefault();sb.from('announcements').insert({title:af.elements['title'].value,body:af.elements['body'].value}).then(function(r){if(r.error)alert(r.error.message);else done('Announcement posted.')})};
}
var first=true;
function animateIn(f){var q='#app .hero,#app h2,#app .lead,#app .card,#app .ev,#app .pcard,#app .gal div,#app .tabsw,#app .btn,#app>a';if(f)q+=',header .logo,header nav a,footer';document.querySelectorAll(q).forEach(function(el,i){el.classList.remove('rin');void el.offsetWidth;el.style.animationDelay=Math.min(i*70,700)+'ms';el.classList.add('rin')})}
function route(){var h=location.hash.slice(1)||'home',k=h,html;
 if(h.indexOf('past-')==0){html=pages.past(h.slice(5));k='events'}else if(pages[h]&&h!='past'){html=pages[h]()}else{k='home';html=pages.home()}
 app.innerHTML=html;if(k=='admin')adminInit();poster.classList.toggle('small',k!='home');animateIn(first);first=false;
 document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.dataset.p==k)});
}
window.addEventListener('hashchange',function(){route();window.scrollTo(0,0)});
route();
loadData().then(route);
/* Poster photos: put photos named 1.jpg, 2.jpg, 3.jpg ... in the images folder and they are found automatically.
   Set IMG_DIR to '' if your photos sit next to index.html. Or list your own file names in PHOTOS. */
var IMG_DIR='images/',PHOTOS=[];
(function(){var strips=document.querySelectorAll('.strip'),count=0,cur=0;
function show(n){strips.forEach(function(st){st.querySelectorAll('.ph').forEach(function(el,k){el.classList.toggle('on',k==n)})})}
function add(src){strips.forEach(function(st){var el=document.createElement('i');el.className='ph';el.style.backgroundImage='url("'+src+'")';st.appendChild(el)});count++;if(count==1)show(0);if(count==2&&!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(function(){cur=(cur+1)%count;show(cur)},6000)}
function next(k){var src=PHOTOS.length?PHOTOS[k]:IMG_DIR+(k+1)+'.jpg';if(!src||k>29)return;var im=new Image();im.onload=function(){add(src);next(k+1)};im.src=src}
next(0)})();
</script>
